name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Formatting
        run: npm run lint

      - name: Type check (Astro + TypeScript)
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
